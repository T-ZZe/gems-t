name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: |
          POM=$(find . -name pom.xml -not -path "*/target/*" | head -n 1)
          if [ -z "$POM" ]; then
            echo "Aucun pom.xml dans le repo :"
            find . -not -path "./.git/*" -type f
            exit 1
          fi
          echo "pom trouvé : $POM"
          mvn -B -f "$POM" clean package
      - uses: actions/upload-artifact@v4
        with:
          name: Gems
          path: '**/target/Gems.jar'
